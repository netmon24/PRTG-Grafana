version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /collector
    schedule:
      interval: weekly
    ignore:
      # Python bleibt auf 3.12, wie in pyproject.toml; ein Wechsel ist eine eigene Entscheidung
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: uv
    directory: /collector
    schedule:
      interval: weekly
