name: Veröffentlichen

on:
  push:
    tags: ["v*.*.*"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag muss auf main liegen
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Der Commit von $GITHUB_REF_NAME liegt nicht auf main. Veröffentlicht wird nur, was in main ist." >&2
            exit 1
          fi
      - name: Tag muss zur Paketversion passen
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in pyproject.toml" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  image:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Rauchtest des Images vor dem Veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64
          load: true
          tags: prtg-grafana:rauchtest
      - name: Rauchtest ausführen (Abhängigkeiten konsistent, Pakete importierbar)
        run: |
          docker run --rm --entrypoint python prtg-grafana:rauchtest -m pip check
          docker run --rm --entrypoint python prtg-grafana:rauchtest -c "import prtg_collector, prtg_collector.portal, fastapi, influxdb_client"
      - name: Sicherheitsprüfung des Images (Trivy), bricht bei behebbaren Funden mit hoher oder kritischer Schwere ab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prtg-grafana:rauchtest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/netmon24/prtg-grafana:${{ steps.version.outputs.number }}
            ghcr.io/netmon24/prtg-grafana:latest
