name: Veröffentlichen

on:
  push:
    tags: ["v*.*.*"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag muss auf main liegen
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Der Commit von $GITHUB_REF_NAME liegt nicht auf main. Veröffentlicht wird nur, was in main ist." >&2
            exit 1
          fi
      - name: Tag muss zur Paketversion passen
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in pyproject.toml" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest

  image:
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Rauchtest des Images vor dem Veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64
          load: true
          tags: prtg-grafana:rauchtest
      - name: Rauchtest ausführen (Abhängigkeiten konsistent, Pakete importierbar)
        run: |
          docker run --rm --entrypoint python prtg-grafana:rauchtest -m pip check
          docker run --rm --entrypoint python prtg-grafana:rauchtest -c "import prtg_collector, prtg_collector.portal, fastapi, influxdb_client"
      - name: Sicherheitsprüfung des Images (Trivy), bricht bei behebbaren Funden mit hoher oder kritischer Schwere ab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prtg-grafana:rauchtest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/netmon24/prtg-grafana:${{ steps.version.outputs.number }}
            ghcr.io/netmon24/prtg-grafana:latest
